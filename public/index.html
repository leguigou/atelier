<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#253e33"><meta name="description" content="Votre atelier de recherche : relier les sources, organiser les idées, écrire un livre."><title>Atelier — Des sources au livre</title><link rel="icon" href="/favicon.svg"><style>
.startup-loader{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:32px 24px;background:radial-gradient(ellipse at 50% 42%,#e7eddf80,transparent 52%),#f6f5f0;color:#253c33;text-align:center}
.startup-content{display:flex;flex-direction:column;align-items:center;animation:startup-arrive .24s ease-out both}
/* Independent particle paths give the cloud an organic, visibly moving rhythm. */
.startup-cloud{position:relative;width:144px;height:100px;margin-bottom:22px;isolation:isolate}
.startup-cloud:before{content:'';position:absolute;inset:8px 15px;background:radial-gradient(ellipse,#dce7cf80,transparent 70%);filter:blur(8px);z-index:-1}
.startup-cloud i{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);border-radius:50%;background:var(--tone);box-shadow:0 0 12px #5d81551a;will-change:transform;animation:startup-drift var(--duration) var(--delay) ease-in-out infinite}
.startup-wordmark{font:36px/1.2 'Libre Caslon Text',Georgia,serif;letter-spacing:-1.2px;margin:0}
.startup-tagline{font:500 9px/1.5 'DM Sans',Arial,sans-serif;letter-spacing:2.4px;color:#8b795e;margin:11px 0 30px}
.startup-message{font:400 12px/1.6 'DM Sans',Arial,sans-serif;color:#687568;margin:0}
@keyframes startup-arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes startup-drift{
  0%,100%{transform:translate(0,0) scale(.85);opacity:.55}
  25%{transform:translate(var(--dx1),var(--dy1)) scale(1.15);opacity:1}
  50%{transform:translate(var(--dx2),var(--dy2)) scale(.9);opacity:.65}
  75%{transform:translate(var(--dx3),var(--dy3)) scale(1.05);opacity:.9}
}
@keyframes startup-breathe{0%,100%{opacity:.45}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.startup-loader *{animation:none!important}.startup-cloud i{transform:none;animation:startup-breathe 2.8s var(--delay) ease-in-out infinite!important}}
